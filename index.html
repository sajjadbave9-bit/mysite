<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>کالاچی</title>

<style>
body {
    font-family: Tahoma, Arial;
    background: #f5f5f5;
    text-align: center;
    padding: 30px;
}

.box {
    background: white;
    border-radius: 20px;
    padding: 25px;
    max-width: 400px;
    margin: auto;
    box-shadow: 0 0 15px #ccc;
}

h1 {
    color: #ff7a00;
}

input {
    width: 90%;
    padding: 15px;
    font-size: 18px;
    border-radius: 10px;
    border: 1px solid #aaa;
}

#priceText {
    margin-top: 20px;
    font-size: 20px;
    color: green;
}
</style>

</head>

<body>

<div class="box">

<h1>🛒 کالاچی</h1>

<p>قیمت کالا را وارد کنید:</p>

<input 
type="number" 
oninput="نمایش_قیمت(this.value)" 
placeholder="مثلا 2500000">

<p id="priceText"></p>

</div>


<script>

function سه_رقم_به_حروف(num) {

const یکان=[
"",
"یک","دو","سه","چهار",
"پنج","شش","هفت","هشت","نه"
];

const دهگان=[
"",
"",
"بیست","سی","چهل",
"پنجاه","شصت","هفتاد",
"هشتاد","نود"
];

const صدگان=[
"",
"صد","دویست","سیصد",
"چهارصد","پانصد","ششصد",
"هفتصد","هشتصد","نهصد"
];

const خاص=[
"ده","یازده","دوازده",
"سیزده","چهارده","پانزده",
"شانزده","هفده","هجده","نوزده"
];


let جواب="";


if(num>=100){
جواب+=صدگان[Math.floor(num/100)]+" ";
num%=100;
}

if(num>=20){
جواب+=دهگان[Math.floor(num/10)]+" ";
num%=10;
}
else if(num>=10){
جواب+=خاص[num-10]+" ";
num=0;
}

if(num>0){
جواب+=یکان[num]+" ";
}


return جواب.trim();

}


function قیمت_به_حروف(عدد){

عدد=Number(عدد);

if(!عدد) return "";


let نتیجه="";


let میلیون=Math.floor(عدد/1000000);

let هزار=Math.floor((عدد%1000000)/1000);

let باقی=عدد%1000;


if(میلیون>0)
نتیجه+=سه_رقم_به_حروف(میلیون)+" میلیون ";


if(هزار>0)
نتیجه+=سه_رقم_به_حروف(هزار)+" هزار ";


if(باقی>0)
نتیجه+=سه_رقم_به_حروف(باقی);


return نتیجه.trim()+" تومان";

}


function نمایش_قیمت(عدد){

document.getElementById("priceText").innerHTML =
قیمت_به_حروف(عدد);

}

</script>


</body>
</html>
