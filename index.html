<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>بازار سجاد</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🛒 بازار سجاد</h1>
    <p>خرید و فروش آسان</p>
</header>

<section>
    <h2>ثبت آگهی جدید</h2>

    <input id="title" placeholder="نام کالا">

    <input id="price" placeholder="قیمت">

    <textarea id="desc" placeholder="توضیحات کالا"></textarea>

    <input id="phone" placeholder="شماره تماس">

    <input id="address" placeholder="آدرس (اختیاری)">

    <input id="city" placeholder="شهر (مثلاً اهواز)">

    <button onclick="addAd()">ثبت آگهی</button>
</section>


<section>
    <h2>آگهی‌ها</h2>
    <div id="ads"></div>
</section>


<script src="app.js"></script>

</body>
</html>
